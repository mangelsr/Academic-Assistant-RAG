version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOCAL_DEV_MODE=true
      - API_KEY=espol-secret-api-key
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./academic-scraper/downloads:/app/downloads

  scraper:
    build:
      context: ./academic-scraper
      dockerfile: Dockerfile
    command: ["--carrera", "CI013", "--headless", "true"]
    volumes:
      - ./academic-scraper/downloads:/app/downloads
