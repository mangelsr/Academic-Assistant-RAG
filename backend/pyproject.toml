[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-assistant-backend"
version = "1.0.0"
description = "FastAPI RAG Backend for University Academic Assistant"
authors = [{ name = "ESPOL RAG Team" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "mangum>=0.17.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "boto3>=1.34.0",
    "opensearch-py>=2.5.0",
    "pypdf>=4.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
